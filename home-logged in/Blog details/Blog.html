<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post | The Margin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
<link rel="StyleSheet" href="Blog.css">
</head>
<body>
 <header class="card">
     <div class="first">The Margin</div>
     <nav id="not-login">
        <a href="../../index.html">Post</a>
        <a href="../logged in .html">Sign in</a>
        <button><a href="../../register/register.html">Get started</a></button>
     </nav>
     <nav id="login" style="display: none;">
        <a href="../../index.html">Post</a>
        <button class="write-post" style="background-color: #b8651a;"><a href="./CULTURE/Culture.html">Write</a></button>
     </nav>
 </header>
 <main id="postState" class="post-state" aria-live="polite">Loading post...</main>

 <main id="postDetails" class="post-details" hidden>
    <a class="back-link" href="../../index.html">&larr; Back to Posts</a>
    <article class="post-reading">
        <p id="postCategory" class="how"></p>
        <h1 id="postTitle"></h1>
        <p id="postExcerpt" class="post-excerpt"></p>
        <div class="post-byline">
            <img id="postAuthorImage" alt="" hidden>
            <p><strong id="postAuthor"></strong><span aria-hidden="true"> &middot; </span><time id="postDate"></time></p>
        </div>
        <img id="postImage" class="post-featured-image" alt="" hidden>
        <div id="postContent" class="post-content"></div>
    </article>
 </main>

 <main id="postError" class="post-state error-message" hidden></main>

 <script src="../API/api.js"></script>
 <script>
    const token = localStorage.getItem("token");

    if (token == null || token == "") {
        document.getElementById("not-login").style.display = "flex";
        document.getElementById("login").style.display = "none";
    } else {
        document.getElementById("not-login").style.display = "none";
        document.getElementById("login").style.display = "flex";
    }

    const postId = new URLSearchParams(window.location.search).get("id");
    const postState = document.getElementById("postState");
    const postDetails = document.getElementById("postDetails");
    const postError = document.getElementById("postError");

    function formatDate(value) {
        if (!value) return "Date unavailable";
        const date = new Date(value);
        return Number.isNaN(date.getTime()) ? value : date.toLocaleDateString("en-US", {
            month: "long",
            day: "numeric",
            year: "numeric"
        });
    }

    function getPostName(post) {
        return post.author?.fullName || "Unknown author";
    }

    function renderPost(post) {
        post = post?.post || post;
        if (!post) throw new Error("The API returned an empty post.");

        const authorName = getPostName(post);
        const image = post.imageUrl;
        const content = post.content || "No content is available for this post.";

        document.title = `${post.title || "Post"} | The Margin`;
        document.getElementById("postCategory").textContent = post.category || "Essay";
        document.getElementById("postTitle").textContent = post.title || "Untitled post";
        const excerpt = document.getElementById("postExcerpt");
        excerpt.textContent = post.excerpt || "";
        excerpt.hidden = !post.excerpt;
        document.getElementById("postAuthor").textContent = authorName;
        document.getElementById("postDate").textContent = formatDate(post.createdAt || post.date);
        document.getElementById("postContent").textContent = content;

        const postImage = document.getElementById("postImage");
        if (image) {
            postImage.src = image;
            postImage.alt = post.title || "Featured post image";
            postImage.hidden = false;
        }

        const authorImage = document.getElementById("postAuthorImage");
        if (post.author?.imageUrl) {
            authorImage.src = post.author.imageUrl;
            authorImage.alt = authorName;
            authorImage.hidden = false;
        }

        postState.hidden = true;
        postDetails.hidden = false;
    }

    function getCachedPost() {
        try {
            const posts = JSON.parse(localStorage.getItem("lamzytech.posts") || "[]");
            return Array.isArray(posts)
                ? posts.find((post) => String(post.id) === String(postId))
                : null;
        } catch (error) {
            console.warn("Could not read cached posts:", error);
            return null;
        }
    }

    function getPostsFromResponse(response) {
        return response && Array.isArray(response.content)
            ? response.content
            : Array.isArray(response)
                ? response
                : Array.isArray(response?.posts)
                    ? response.posts
                    : [];
    }

    async function loadPost() {
        if (!postId) {
            postState.hidden = true;
            postError.textContent = "This post link is missing an ID. Return to Posts and choose a post to read.";
            postError.hidden = false;
            return;
        }

        try {
            const cachedPost = getCachedPost();
            if (cachedPost) {
                renderPost(cachedPost);
                return;
            }

            const response = await apiRequest("/api/posts");
            const posts = getPostsFromResponse(response);
            const post = posts.find((item) => String(item.id) === String(postId));

            if (!post) {
                throw new Error("This post could not be found.");
            }

            localStorage.setItem("lamzytech.posts", JSON.stringify(posts));
            renderPost(post);
        } catch (error) {
            console.error("Failed to load post:", error);
            postState.hidden = true;
            postError.textContent = error.message || "We could not load this post. It may have been removed or the API may be unavailable.";
            postError.hidden = false;
        }
    }

    loadPost();
 </script>
</html>
