<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="stylesheet" href="logged in .css">
</head>
<body>
<header class="content">
<div class="view">The Margin</div>
<nav>
    <a href="#">Post</a>
<a href="#">Sign in</a>
<button>GET STARTED</button>
</nav>
</header>
<section class="inform">
    <form id="loginForm">

        <h1 class="back">WELCOME BACK</h1>
        <p class="sigh">Sign in to continue writing and reading.</p>
        
        <label class="have">Email</label>
        <input id="email" placeholder="nankume@gmail.com" required>
        <label>Password</label>
        <input id="password" placeholder="1234567" required>
        <button id="submitBtn" type="submit" class="down">Create account</button>
    
    </form>
    <p class="type">Don't have an account? <a class="sign-up" href="../register/register.html">Sign up</a></p>
</section>
<div class="footer">
    <h2>The Margin</h2>
    <p class="place">A place for ideas worth keeping.</p>
</div>
<script src="../home-logged in/API/api.js"></script>
<script>
    async function loginStudent(email, password) { 
  const data = await apiRequest("/api/auth/login", { 
    method: "POST", 
    body: JSON.stringify({ email, password }), 
  }); 
  
  localStorage.setItem("token", data.token); 
  localStorage.setItem("student", JSON.stringify(data.student)); 
  
  return data.student; 
} 
 submitBtn.textContent = "Sending...";

document.getElementById("loginForm").addEventListener("submit", async (e) => { 
  e.preventDefault(); 
  try { 
    await loginStudent( 
      document.getElementById("email").value, 
      document.getElementById("password").value 
    ); 
    window.location.href = "./logged in.html"; 
  } catch (err) { 
    alert(err.message); // e.g. "Invalid email or password" 
  } 
}); 
</script>

</body>
</html>
