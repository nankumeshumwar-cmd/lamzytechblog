<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="culture.css">
</head>
<body>
   
<header class="content">
<div class="view">The Margin</div>
<nav>
    <a href="#">Posts</a>
<button>Write</button>
<div>
    <img src="images/Image (Margot Ellison).png">
</div>
</nav>
</header>
<section class="inform">

    <section class="topbar">
        <form id="createPostForm">
        <h1>Write a new post</h1>
        <p>Share an idea, an essay, a reflection.</p>
        <p>title</p>
        <input id="title" type="text" placeholder="something worth reading">
        <label>Excerpt (optional — generated from content if blank)</label>
        <input id="title" type="text" placeholder="A sentence or two that draws the reader in.">
        <div class="layout">
            <div class="mr-jesse">
                <label class="run">Category</label>
                <input id="title" type="text" placeholder="culture">

            </div>
            <div class="lamzy">
                <label>Read time (minutes)</label>
                <input id="title" type="text" placeholder="Read time (minutes) ">
            </div>
        </div>

        <div class="space">
            <p>Content</p>
            <textarea placeholder="Start writing... Separate paragraphs with a blank line. Wrap *words* in asterisks for italics."
                        rows=20></textarea>
        
        </div>
    </form>
    
        <div class="meta">
            <button>Publish post</button>
            <p>cancel</p>
        </div>  
    
    
    
    </section>
    
</section>


<section class="footer">
    
<h3>The margin</h3>
<P>A place for ideas worth keeping.</P>
<p>Sign out</p>

</section>

<script src="../../API/api.js"></script>
<script>
    async function createPost(title, content, category, imageUrl) { 
  return await apiRequest( 
    "/api/posts", 
    { 
      method: "POST", 
      body: JSON.stringify({ title, content, category, imageUrl }), 
    }, 
    true // authRequired = true, attaches the JWT 
  ); 
} 
document.getElementById("createPostForm").addEventListener("submit", async (e) => { 
  e.preventDefault(); 
  
  if (!isLoggedIn()) { 
    alert("You need to log in first."); 
    window.location.href = "login.html"; 
    return; 
  } 
  
  try { 
    const post = await createPost( 
      document.getElementById("title").value, 
      document.getElementById("content").value, 
      document.getElementById("category").value, 
      document.getElementById("imageUrl").value // can be empty 
    ); 
     submitBtn.textContent = "Sending...";
    window.location.href = `}`; 
  } catch (err) { 
    alert(err.message); // e.g. "Title is required" 
  } 
}); 
 

</script>
</body>
</html>
