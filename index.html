<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>project</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
<link rel="StyleSheet" href="home.css">
</head>
<body>
 <header class="card">
     <div class="first">the margin</div>
     <nav id="not-login">
        <a href="./index.html">post</a>
        <a href="./home-logged in/logged in .html">Sign in</a>
        <button> <a href="./register/register.html">Get started</a></button>
     </nav>
     <nav id="login" style="display: none;">
        <a href="./index.html">post</a>
        <button class="write-post" style="background-color: #b8651a;"><a href="./home-logged in/Blog details/CULTURE/Culture.html">Write</a></button>
     </nav>
 </header>  
 <div class="hero">
    <h4 class="writing">Independent writing</h4>
    <h2 class="reading">Ideas worth sitting with.</h2>
    <p class="under">Essays on culture, technology, and the examined life. No <br>algorithms, no hot takes.</p>
 
    <div id="featuredPost" class="information"></div>
  
    <section class="below-hero">
        
        <div class="title">MORE Essays</div>
        
        <div id="postsGrid" class="tech"></div>
    </section>
</div> 

 <div class="footer">
    <h2 class="title">the margin</h2>
    <h2 class="next">A place for ideas worth keeping.</h2>
 </div>

 <script src="./home-logged in/API/api.js"></script>
 <script>
    const token = localStorage.getItem("token");

    if (token == null || token == "") {
        document.getElementById("not-login").style.display = "flex";
        document.getElementById("login").style.display = "none";
    } else {
        document.getElementById("not-login").style.display = "none";
        document.getElementById("login").style.display = "flex";
    }

    function formatDate(value) {
        if (!value) return "Recently";
        const date = new Date(value);
        if (Number.isNaN(date.getTime())) return value;
        return date.toLocaleDateString("en-US", {
            month: "long",
            day: "numeric",
            year: "numeric"
        });
    }

    function safeText(value, fallback) {
        return value ?? fallback;
    }

    function renderFeaturedPost(post) {
        const featured = document.getElementById("featuredPost");
        if (!featured || !post) return;

        const image = safeText(post.imageUrl, "images/Image (The Quiet Discipline of Reading Without Purpose).png");
        const category = safeText(post.category, "culture").toLowerCase();
        const title = safeText(post.title, "The Quiet Discipline of Reading Without Purpose");
        const excerpt = safeText(post.excerpt, post.content || "In an age of productivity optimization, there is something quietly radical about picking up a book with no agenda beyond the pleasure of it.");
        const author = post.author && post.author.fullName ? post.author.fullName : "Margot Ellison";
        const readTime = post.readTime || 4;
        const createdAt = formatDate(post.createdAt || post.date);

        featured.innerHTML = `
            <div>
                <img src="${image}">
            </div>
            <div class="page">
                <h6>${category}</h6>
                <h3>${title}</h3>
                <p>${excerpt}</p>
                <div class="about">
                    <div>
                        <img src="images/Image (Margot Ellison).png">
                    </div>
                    <p>${author} · ${createdAt} · ${readTime} min read</p>
                </div>
            </div>
        `;
    }

    function renderPosts(posts) {
        const postsGrid = document.getElementById("postsGrid");
        if (!postsGrid) return;

        const list = Array.isArray(posts) ? posts : [];
        const cards = list.slice(0, 3).map((post) => {
            const category = safeText(post.category, "ideas").toLowerCase();
            const title = safeText(post.title, "Untitled");
            const excerpt = safeText(post.excerpt, post.content || "A thoughtful piece on ideas worth keeping.");
            const author = post.author && post.author.fullName ? post.author.fullName : "thomas vael";
            const readTime = post.readTime || 5;
            const image = safeText(post.imageUrl, "images/BlogListing.png");

            return `
                <div class="tech-sub">
                    <div class="tech-image">
                        <img src="${image}">
                    </div>
                    <h1 class="come">${category}</h1>
                    <h2 class="welcome">${title}</h2>
                    <p class="story">${excerpt}</p>
                    <div class="more">
                        <div>
                            <img src="images/Image (Thomas Vael) (1).png">
                        </div>
                        <p>${author.toLowerCase()}. ${readTime} min</p>
                    </div>
                </div>
            `;
        }).join("");

        postsGrid.innerHTML = cards;
    }

    async function loadPosts() {
        try {
            const response = await apiRequest("/api/posts");
            const content = response && Array.isArray(response.content)
                ? response.content
                : Array.isArray(response)
                    ? response
                    : Array.isArray(response?.posts)
                        ? response.posts
                        : [];

            if (!content.length) return;

            renderFeaturedPost(content[0]);
            renderPosts(content.slice(1));
        } catch (error) {
            console.error("Failed to load posts:", error);
        }
    }

    loadPosts();
 </script>
</body>
</html>
