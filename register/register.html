<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="stylesheet" href="register.css">
    
    </script>
</head>
<body>
    <header>
        <div class="view">The Margin</div>
        <nav id="not-login">
             <a href="../index.html">Post</a>
             <a href="../home-logged in/logged in .html">Sign in</a>
             <button><a href="./register.html">Get started</a></button>
        </nav>
        <nav id="login" style="display: none;">
             <a href="../index.html">Post</a>
             <button class="write-post" style="background-color: #b8651a;"><a href="../home-logged in/Blog details/CULTURE/Culture.html">Write</a></button>
        </nav>
</header>
<section class="inform">
    <form id="registerForm">

        <h1>Start writing</h1>
        <P>Create an account and publish your first essay.</P>
        <label for="fullName" class="have"> YOUR Name</label>
        <input id="fullName" type="text" placeholder="christabel">
        <label for="email">Email</label>
        <input id="email" type="email" placeholder="nankume@gmail.com">
        <label for="password">Password</label>
        <input id="password" type="password" placeholder="1234567">
        <button id="submitBtn" type="submit" class="down">Create account</button>
        <label for="signIn" class="type">Already have an account?<a class="sign-up" href="../home-logged in/logged in .html">Sign in</a> </label>
        
    </form>
</section>
<div class="footer">
    <h2>the margin</h2>
    <h2>A place for ideas worth keeping.</h2>
</div>

<script>
  const token = localStorage.getItem("token");

  if (token == null || token == "") {
      document.getElementById("not-login").style.display = "flex";
      document.getElementById("login").style.display = "none";
  } else {
      document.getElementById("not-login").style.display = "none";
      document.getElementById("login").style.display = "flex";
  }
</script>

<script src="../home-logged in/API/api.js"></script>


<script>
  const form = document.getElementById("registerForm");
  const msg = document.getElementById("msg");
  const submitBtn = document.getElementById("submitBtn");



  async function registerStudent(fullName, email, password) {
    const data = await apiRequest("/api/auth/register", {
      method: "POST",
      body: JSON.stringify({
        fullName,
        email,
        password,
        department: "Computer Science",
        level: "300",
      }),
    });

    localStorage.setItem("token", data.token);
    localStorage.setItem("student", JSON.stringify(data.student));
    return data.student;
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    submitBtn.disabled = true;
    submitBtn.textContent = "Sending...";

    try {
      const student = await registerStudent(
        document.getElementById("fullName").value.trim(),
        document.getElementById("email").value.trim(),
        document.getElementById("password").value
      );

      console.log(`Welcome, ${student.fullName}! Token saved. Redirecting to login page...`);
      setTimeout(() => (window.location.href = "../home-logged in/logged in .html"), 800);
    } catch (err) {
      alert(err.message || "Registration failed. Please try again.");
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = "Create account";
    }
  });
</script>

</body>
