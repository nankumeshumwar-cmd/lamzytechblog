<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="stylesheet" href="logged in .css">
</head>
<body>
<header class="content">
<div class="view">The Margin</div>
<nav id="not-login">
    <a href="../index.html">Post</a>
    <a href="./logged in .html">Sign in</a>
    <button><a href="../register/register.html">Get started</a></button>
</nav>
<nav id="login" style="display: none;">
    <a href="../index.html">Post</a>
    <button class="write-post" style="background-color: #b8651a;"><a href="./Blog details/CULTURE/Culture.html">Write</a></button>
</nav>
</header>
<section class="inform">
    <form id="loginForm">

        <h1 class="back">WELCOME BACK</h1>
        <p class="sigh">Sign in to continue writing and reading.</p>
        
        <label class="have">Email</label>
        <input id="email" placeholder="nankume@gmail.com" required>
        <label>Password</label>
        <input id="password" placeholder="1234567" required>
        <button id="submitBtn" type="submit" class="down">Create account</button>
    
    </form>
    <p class="type">Don't have an account? <a class="sign-up" href="../register/register.html">Sign up</a></p>
</section>
<div class="footer">
    <h2>The Margin</h2>
    <p class="place">A place for ideas worth keeping.</p>
</div>
<script src="../home-logged in/API/api.js"></script>
<script>
    const token = localStorage.getItem("token");

    if (token == null || token == "") {
        document.getElementById("not-login").style.display = "flex";
        document.getElementById("login").style.display = "none";
    } else {
        document.getElementById("not-login").style.display = "none";
        document.getElementById("login").style.display = "flex";
    }

    const submitBtn = document.getElementById("submitBtn");

    async function loginStudent(email, password) {
      const data = await apiRequest("/api/auth/login", {
        method: "POST",
        body: JSON.stringify({ email, password }),
      });

      localStorage.setItem("token", data.token);
      localStorage.setItem("student", JSON.stringify(data.student));
      return data.student;
    }

    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      submitBtn.disabled = true;
      submitBtn.textContent = "Sending...";

      try {
        await loginStudent(
          document.getElementById("email").value.trim(),
          document.getElementById("password").value
        );
        window.location.href = "../index.html";
      } catch (err) {
        alert(err.message || "Login failed. Please try again.");
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = "Create account";
      }
    });
</script>

</body>
</html>
